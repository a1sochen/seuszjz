version: '3'

# 东南大学讲座助手: 同一份 Go 代码编出 Windows 桌面版 (默认) 与服务器版 (-tags server)。
# 桌面相关的打包步骤在 build/windows/Taskfile.yml, 公共步骤在 build/Taskfile.yml。

vars:
  APP_NAME: "seuszjz"
  BIN_DIR: "bin"
  VITE_PORT: '{{.WAILS_VITE_PORT | default 9245}}'
  # Windows 下可执行文件带 .exe, 其它平台为空。
  exeExt: '{{if eq OS "windows"}}.exe{{end}}'
  # 目标系统; 默认当前系统, 便于 `task build` 在本机直接跑。
  GOOS: '{{.GOOS | default OS}}'

includes:
  common: ./build/Taskfile.yml
  windows: ./build/windows/Taskfile.yml

tasks:
  build:
    summary: 构建桌面版 (Windows)
    cmds:
      - task: "{{.GOOS}}:build"

  run:
    summary: 构建并运行桌面版
    cmds:
      - task: "{{.GOOS}}:run"

  dev:
    summary: 开发模式 (前端热更新 + 自动重编 Go)
    cmds:
      - wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}

  build:server:
    summary: 构建服务器版二进制 (本机平台, 纯 HTTP 无 GUI)
    cmds:
      - task: common:build:server

  run:server:
    summary: 构建并运行服务器版
    cmds:
      - task: common:run:server

  build:docker:
    summary: 构建服务器版 Docker 镜像
    cmds:
      - task: common:build:docker

  run:docker:
    summary: 构建并运行 Docker 镜像 (默认映射 8080)
    cmds:
      - task: common:run:docker
