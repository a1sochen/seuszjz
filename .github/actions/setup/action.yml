name: 准备构建环境
description: 安装 Go、Node.js（必要时还有 wails3），供发布流程的各平台任务复用。

inputs:
  wails-version:
    description: wails3 版本号
    required: false
    default: v3.0.0-beta.34
  install-wails:
    description: 是否安装 wails3。只有 Windows 构建需要它；Linux 上编译 wails3 要求 GTK4/WebKitGTK 开发包，服务版构建用不到，所以默认不装。
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: 安装 Go（版本取自 go.mod）
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
        cache: true

    - name: 安装 Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: npm
        cache-dependency-path: frontend/package-lock.json

    - name: 缓存 wails3
      if: inputs.install-wails == 'true'
      id: cache-wails
      uses: actions/cache@v4
      with:
        path: .gobin
        key: wails3-${{ inputs.wails-version }}-${{ runner.os }}

    - name: 安装 wails3
      if: inputs.install-wails == 'true' && steps.cache-wails.outputs.cache-hit != 'true'
      shell: bash
      env:
        GOBIN: ${{ github.workspace }}/.gobin
      run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ inputs.wails-version }}

    - name: 把 wails3 加进 PATH
      if: inputs.install-wails == 'true'
      shell: bash
      run: |
        mkdir -p "$GITHUB_WORKSPACE/.gobin"
        echo "$GITHUB_WORKSPACE/.gobin" >> "$GITHUB_PATH"
        "$GITHUB_WORKSPACE/.gobin/wails3" version
